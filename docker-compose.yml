# pd-defence MCP server on the owner's laptop. The port is published on
# loopback only: cloudflared on the same machine is the only way in.
services:
  pd-mcp:
    # BUILD_CONTEXT: the tagged public release once PUBLIC_REF exists (spec 008 T040)
    build: ${BUILD_CONTEXT:-.}
    image: pd-defence-mcp:latest
    container_name: pd-defence-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PD_PORT:-8765}:8765"
    environment:
      PD_MCP_TOKEN: ${PD_MCP_TOKEN:?set PD_MCP_TOKEN (openssl rand -hex 32)}
      PD_PROVIDER: ${PD_PROVIDER:-tiingo}
      TIINGO_API_KEY: ${TIINGO_API_KEY:-}
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      PD_SEC_CONTACT: ${PD_SEC_CONTACT:-}
      PD_ALLOWED_HOSTS: ${PD_ALLOWED_HOSTS:-}
      PD_TODAY_TTL_MIN: ${PD_TODAY_TTL_MIN:-240}
      PD_SCAN_SOURCE: ${PD_SCAN_SOURCE:-off}
      PD_SCHEDULE: ${PD_SCHEDULE:-off}
      PD_SCAN_TIMES: ${PD_SCAN_TIMES:-10:00,12:30,15:00,17:30}
      PD_SITE_PRICES: ${PD_SITE_PRICES:-off}
      PD_SITE_DISCUSSIONS: ${PD_SITE_DISCUSSIONS:-}
      PD_SITE_URL: ${PD_SITE_URL:-}
      PD_STORIES_SUBMIT_URL: ${PD_STORIES_SUBMIT_URL:-}
      PD_TURNSTILE_SITEKEY: ${PD_TURNSTILE_SITEKEY:-}
    volumes:
      - pd-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  pd-data:
